<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1><img src="/images/f_f_object_91_s32_f_object_91_1nbg.png" class="head-img">HabitTracker</h1>
        <img src="/images/calender.png" class="calender-img">
        <p id="date"></p>
    </header>
    <div class="all-area">
        <h3 class="habit-text">今日の習慣</h3>
        <div class="task-area">
            <div class="input-area">
                <button id="inputTaskBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-plus-circle-fill icon-plus" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z" class="hoge"/>
                    </svg>
                    <span>新しい習慣を追加する</span>
                </button>
            </div>
            <ul id="card-area" style="list-style: none; padding-inline-start: 0;">
            </ul>
        </div>
    </div>
    <dialog id="TaskDialog">
        <h2>習慣の追加</h2>
        <p>
            習慣ID:<br>
            <input type="text" id="taskIdText" required><br>
            <p>半角英数字・ハイフン・アンダースコアが使用できます</p>
        </p>
        <p>
            習慣名:<br>
            <input type="text" id="taskNameText" required><br>
            <p>習慣名を入力して下さい</p>
        </p>
        <button id="closeDialogBtn">キャンセル</button>
        <button id="addTaskBtn">追加する</button>
        <button id="editTaskBtn" hidden>更新する</button>
    </dialog>
    <dialog id="DeleteDialog">
        <h2>この習慣を削除しますか？</h2>
        <p></p>
        <button id="closeDeleteDialogBtn">キャンセル</button>
        <button id="deleteTaskBtn">削除する</button>
    </dialog>
    <script src="js/script.js"></script>
</body>
</html>
