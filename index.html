<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitTracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <div class="all-area">
        <header class="header">
            <h1>HabitTracker</h1>
            <p id="date"></p>
        </header>
        <p class="habit-text">今日の習慣</p>
        <div class="card-area">
            <ul style="list-style: none;">
                <li class="li-item">
                    <p class="task-text">読書する</p>
                    <button type="button" id="btn-reading">
                        完了する
                    </button>
                </li>
                <li class="li-item">
                    <p class="task-text">勉強する</p>
                    <button type="button" id="btn-studying">
                        完了する
                    </button>
                </li>
                <li class="li-item">
                    <p class="task-text">ゲームする</p>
                    <button type="button" id="btn-gaming">
                        完了する
                    </button>
                </li>
            </ul>
        </div>
     </div>
    <script src="js/script.js"></script>
</body>
</html>
